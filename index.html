<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ދަސްކުރުމުގެ ފޮތް · Study Book</title>
<style>
:root{
  --paper:#F6F8FC; --surface:#FFFFFF; --ink:#1D2A44; --muted:#5D6B85; --line:#DCE3EE;
  --hi:#FFE45C; --hi-ink:#1D2A44; --brand:#2747A6; --brand-ink:#FFFFFF;
  --ok:#0F8B6D; --ok-soft:#DDF4EC; --bad:#D23F44; --bad-soft:#FBE3E3; --chip:#E9EEF8;
  --thaana:"Faruma","MV Faruma","Dhivehi","MV Dhivehi","A_Faruma","MV Boli";
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826; --surface:#1B2334; --ink:#E7ECF5; --muted:#9AA7C0; --line:#2C3750;
    --hi:#E8C93A; --hi-ink:#151B28; --brand:#7D9BFF; --brand-ink:#0E1424;
    --ok:#3FCB9F; --ok-soft:#173A33; --bad:#FF7A7E; --bad-soft:#3E1F25; --chip:#26314A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121826; --surface:#1B2334; --ink:#E7ECF5; --muted:#9AA7C0; --line:#2C3750;
  --hi:#E8C93A; --hi-ink:#151B28; --brand:#7D9BFF; --brand-ink:#0E1424;
  --ok:#3FCB9F; --ok-soft:#173A33; --bad:#FF7A7E; --bad-soft:#3E1F25; --chip:#26314A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
/* Dhivehi mode: Faruma / Dhivehi installed fonts first, then system default */
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Faruma","MV Faruma","Dhivehi","MV Dhivehi","A_Faruma","MV Boli",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px;line-height:1.9;-webkit-tap-highlight-color:transparent}
/* English mode: system font for Latin, Thaana characters still fall back to Faruma / Dhivehi */
html[lang="en"] body{font-family:system-ui,"Segoe UI",Roboto,Arial,"Faruma","MV Faruma","Dhivehi","MV Dhivehi","MV Boli",sans-serif;font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 130px}
.num{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.title{margin:0;font-size:1.75rem;font-weight:800;line-height:1.45}
.title span{background:linear-gradient(transparent 58%,var(--hi) 58%,var(--hi) 92%,transparent 92%);padding:0 2px}
.sub{margin:0;color:var(--muted);font-size:.95rem}
.hdr-actions{display:flex;gap:8px;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;display:grid;place-items:center;font-size:1.1rem;padding:0 10px}
.langbtn{font-weight:700;font-size:.95rem;font-family:"Faruma","MV Faruma","Dhivehi","MV Boli",system-ui,sans-serif}

.stats{display:flex;gap:18px;margin:6px 0 18px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:1.15rem;margin-inline-start:4px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:.85rem;line-height:1.5}
nav.tabs button .ic{font-size:1.3rem;line-height:1.3}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:800}

.view{display:none}.view.on{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.big{padding:12px 22px;font-size:1.05rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:4px 14px;white-space:nowrap;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.list{list-style:none;margin:14px 0 0;padding:0;counter-reset:q}
.item{border-bottom:1px solid var(--line);counter-increment:q}
.q{width:100%;text-align:start;border:0;background:none;padding:14px 0;display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:1.05rem}
.q::before{content:counter(q);flex:none;min-width:28px;height:28px;border-radius:8px;background:var(--chip);color:var(--muted);font-size:.85rem;display:grid;place-items:center;margin-top:4px;font-family:system-ui,sans-serif;line-height:1}
.q .txt{flex:1}
.q .tog{flex:none;color:var(--muted);font-size:.85rem;font-weight:400;margin-top:4px;transition:transform .2s}
.item.open .q .tog{transform:rotate(180deg)}
.ans{display:none;padding-bottom:16px;padding-inline-start:40px}
.item.open .ans{display:block;animation:pop .2s ease-out}
.ans p{margin:0 0 8px;white-space:pre-wrap}
mark.hl{background:var(--hi);color:var(--hi-ink);padding:2px 6px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:2.1}
.meta{display:flex;gap:12px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.meta button{border:0;background:none;color:var(--brand);padding:2px 0;font-size:.85rem}
.meta button.del{color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.empty{text-align:center;padding:48px 10px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.3rem;margin:0 0 6px}
.empty .row{justify-content:center;margin-top:16px}

.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px}
.flash{width:100%;max-width:560px;min-height:280px;perspective:1200px;border:0;background:none;padding:0}
.flash .inner{position:relative;width:100%;min-height:280px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 24px;text-align:center;font-size:1.25rem;font-weight:600;overflow:auto;white-space:pre-wrap}
.face small{display:block;font-size:.85rem;color:var(--muted);font-weight:400;margin-top:14px;white-space:normal}
.face.back{transform:rotateY(180deg);background:var(--hi);color:var(--hi-ink);border-color:transparent}
.face.back small{color:inherit;opacity:.7}
.progress{width:100%;max-width:600px;display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem}
.toggle{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}

.qcard,.setup{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:600px}
.qcard h3{margin:0 0 16px;font-size:1.2rem;line-height:1.7;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;white-space:pre-wrap}
.opt.right{background:var(--ok-soft);border-color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{min-height:1.8em;margin-top:12px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.setup h2{margin:0 0 4px;font-size:1.3rem}
.setup p{margin:0 0 16px;color:var(--muted)}
.center{text-align:center}
label.f{display:block;margin-bottom:14px;font-size:.95rem;color:var(--muted)}
label.f > select,label.f > input,label.f > textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper);color:var(--ink)}
textarea{resize:vertical;line-height:1.8}
.score{font-size:3rem;font-weight:800;line-height:1.3;font-family:system-ui,sans-serif}
.review{list-style:none;padding:0;margin:16px 0 0;text-align:start}
.review li{border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}
.review li b{display:block}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.mcol{display:grid;gap:10px;align-content:start}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:start;font-size:.95rem;min-height:56px;line-height:1.7}
.tile.q{font-weight:600}
.tile.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.tile.done{background:var(--ok-soft);border-color:var(--ok);opacity:.55;pointer-events:none}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.teams{display:grid;gap:8px}
.board{display:flex;gap:8px;width:100%;max-width:640px;flex-wrap:wrap}
.team{flex:1 1 120px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:center}
.team.turn{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.team .n{font-size:.9rem;color:var(--muted)}
.team .s{font-size:1.8rem;font-weight:800;font-family:system-ui,sans-serif;line-height:1.3}
.timer{width:100%;max-width:640px;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--brand);transition:width 1s linear}
.timer.low i{background:var(--bad)}
.turnline{font-size:1.1rem;font-weight:800}
.secs{font-family:system-ui,sans-serif;font-weight:800;color:var(--muted)}

dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));background:var(--surface);color:var(--ink);max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(10,15,30,.5)}
.dlg{padding:20px}
.dlg h2{margin:0 0 12px;font-size:1.25rem}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:6px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:800}
.hint{font-size:.88rem;color:var(--muted);margin:-6px 0 12px}
.menu{display:grid;gap:8px}
.menu .btn{text-align:start}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:18px;background:var(--paper);font-weight:600;cursor:pointer;margin-bottom:12px}
.filebtn:focus-within,.filebtn.drag{outline:3px solid var(--brand)}
.filebtn.drag{background:var(--chip)}
.pstatus{font-size:.92rem;color:var(--muted);margin:0 0 10px;min-height:1.5em}
.pstatus.err{color:var(--bad)}
.ai-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ai-row .btn{font-size:.92rem}
.preview{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.prow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.prow:last-child{border-bottom:0}
.prow.off{opacity:.45}
.prow input[type=checkbox]{margin-top:10px;width:18px;height:18px;flex:none}
.prow .fields{flex:1;display:grid;gap:6px;min-width:0}
.prow textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper);color:var(--ink);font-size:.95rem;line-height:1.7}
.prow textarea.pa{background:var(--hi);color:var(--hi-ink);border-color:transparent}

.fab{position:fixed;inset-inline-end:max(16px,calc(50% - 364px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;border:0;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:12px 18px;font-weight:800;box-shadow:0 6px 18px rgba(20,30,70,.25)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="title"><span data-t="appTitle"></span></h1>
      <p class="sub" id="modeNote" data-t="tagline"></p>
    </div>
    <div class="hdr-actions">
      <button class="iconbtn langbtn" id="langBtn" aria-label="Switch language / ބަސް ބަދަލުކުރޭ"></button>
      <button class="iconbtn" id="menuBtn" data-ta="moreOptions">⋯</button>
    </div>
  </header>

  <div class="stats" aria-live="polite">
    <span><span data-t="stTotal"></span> <b id="stTotal" class="num">0</b></span>
    <span><span data-t="stKnown"></span> <b id="stKnown" class="num">0</b></span>
    <span><span data-t="stLeft"></span> <b id="stLeft" class="num">0</b></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="stBar"></i></div>

  <section class="view on" id="v-list">
    <div class="row">
      <input class="search" id="search" type="search" data-tp="searchPh" dir="auto">
      <button class="btn" id="toggleAll" aria-pressed="false"></button>
    </div>
    <div class="chips" id="chips-list" role="group"></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="emptyList" hidden>
      <h2 data-t="emptyTitle"></h2>
      <p data-t="emptyText"></p>
      <div class="row">
        <button class="btn primary" data-open-add data-t="addQuestion"></button>
        <button class="btn" id="sampleBtn" data-t="samples"></button>
      </div>
    </div>
  </section>

  <section class="view" id="v-flash">
    <div class="chips" id="chips-flash" role="group"></div>
    <div class="stage" id="flashStage"></div>
  </section>
  <section class="view" id="v-quiz"><div class="stage" id="quizStage"></div></section>
  <section class="view" id="v-match"><div class="stage" id="matchStage"></div></section>
  <section class="view" id="v-group"><div class="stage" id="groupStage"></div></section>
</div>

<button class="fab" data-open-add data-t="fab"></button>

<nav class="tabs">
  <div class="in">
    <button data-tab="list" aria-current="page"><span class="ic">📒</span><span data-t="tabList"></span></button>
    <button data-tab="flash"><span class="ic">🃏</span><span data-t="tabFlash"></span></button>
    <button data-tab="quiz"><span class="ic">✅</span><span data-t="tabQuiz"></span></button>
    <button data-tab="match"><span class="ic">🧩</span><span data-t="tabMatch"></span></button>
    <button data-tab="group"><span class="ic">👥</span><span data-t="tabGroup"></span></button>
  </div>
</nav>

<dialog id="addDlg">
  <form class="dlg" method="dialog" id="addForm">
    <h2 id="addTitle"></h2>
    <div class="seg" id="addSeg">
      <button type="button" data-mode="one" aria-pressed="true" data-t="oneQ"></button>
      <button type="button" data-mode="bulk" aria-pressed="false" data-t="manyQ"></button>
      <button type="button" data-mode="pdf" aria-pressed="false" data-t="fileTab"></button>
    </div>
    <label class="f"><span data-t="subject"></span><input id="fSubj" list="subjList" data-tp="subjectPh" dir="auto"></label>
    <datalist id="subjList"></datalist>
    <div id="oneBox">
      <label class="f"><span data-t="question"></span><textarea id="fQ" rows="3" dir="auto"></textarea></label>
      <label class="f"><span data-t="answer"></span><textarea id="fA" rows="4" dir="auto"></textarea></label>
    </div>
    <div id="bulkBox" hidden>
      <p class="hint" data-t="bulkHint"></p>
      <label class="f"><span class="sr" data-t="manyQ"></span><textarea id="fBulk" rows="9" dir="auto"></textarea></label>
    </div>
    <div id="pdfBox" hidden>
      <p class="hint" data-t="fileHint"></p>
      <label class="filebtn" id="dropZone">📄 <span data-t="chooseFile"></span><input type="file" id="pdfFile" multiple accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.xls,.json,image/*,application/pdf" class="sr"></label>
      <div class="row" style="margin-bottom:10px"><button type="button" class="btn" id="pasteBtn" data-t="pasteBtn"></button><span class="hint" style="margin:0" data-t="pasteHint"></span></div>
      <p class="pstatus" id="pdfStatus" aria-live="polite"></p>
      <div class="ai-row" id="aiRow" hidden>
        <button type="button" class="btn" id="aiText" data-t="aiFind"></button>
        <button type="button" class="btn ghost" id="aiImg" data-t="aiScan" hidden></button>
      </div>
      <div class="preview" id="pdfPreview" hidden></div>
    </div>
    <div class="row">
      <button type="button" class="btn primary" id="saveBtn" data-t="save"></button>
      <button type="button" class="btn ghost" id="cancelBtn" data-t="cancel"></button>
    </div>
  </form>
</dialog>

<dialog id="menuDlg">
  <div class="dlg">
    <h2 data-t="moreOptions"></h2>
    <div class="menu">
      <button class="btn" id="langBtn2" data-t="switchLang"></button>
      <button class="btn" id="exportBtn" data-t="export"></button>
      <button class="btn" id="importBtn" data-t="import"></button>
      <button class="btn" id="resetProgBtn" data-t="resetProg"></button>
      <button class="btn" id="themeBtn" data-t="theme"></button>
      <button class="btn ghost" id="menuClose" data-t="close"></button>
    </div>
    <p class="note" id="storeNote"></p>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- translations ---------- */
const I18N={
 dv:{appTitle:"ދަސްކުރުމުގެ ފޮތް",tagline:"ސުވާލާއި ޖަވާބު ރިވައިޒްކުރުމަށް",cloudTag:"ކްލައުޑްގައި ރައްކާވެފައި",
  stTotal:"ސުވާލު",stKnown:"ދަސްވެއްޖެ",stLeft:"ބާކީ",searchPh:"ސުވާލެއް ހޯދާ…",showAll:"ހުރިހާ ޖަވާބެއް ދައްކާ",hideAll:"ހުރިހާ ޖަވާބެއް ފޮރުވާ",
  emptyTitle:"އަދި ސުވާލެއް ނެތް",emptyText:"ފުރަތަމަ ސުވާލާއި ޖަވާބު ލިޔެލާ، ނުވަތަ ނަމޫނާއިން ފަށާ.",addQuestion:"ސުވާލު އިތުރުކުރޭ",editQuestion:"ސުވާލު ބަދަލުކުރޭ",samples:"ނަމޫނާ ސުވާލުތައް",

async function connectCloud(){
  if(!window.claude||!window.claude.use)return;
  let db=null,user=null;
  try{[db,user,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")])}catch(e){}
  if(!db)return;
  let canWrite=null;try{canWrite=user?await user.can("data.write"):null}catch(e){}
  if(canWrite===false)return;
  dbRef=db.collection("cards");
  let first=true;
  dbRef.onSnapshot(async snap=>{
    const remote=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(first){
      first=false;mode="db";
      $("#modeNote").textContent=t("cloudTag");$("#storeNote").textContent=t("noteCloud");
      if(remote.length===0&&cards.length){
        for(const c of cards.slice()){try{await dbRef.doc(c.id).set(clean(c))}catch(e){mode="local";return}}
        return;
      }
    }
    if(snap.metadata&&snap.metadata.fromCache&&remote.length===0&&cards.length)return;
    cards=remote.sort((a,b)=>(a.created||0)-(b.created||0));
    renderAllStatic();
  },()=>{mode="local";loadLocal();renderAllStatic()});
}

function parseBulk(text,subj){
  const out=[];
  text.replace(/\r/g,"").split(/\n\s*\n/).forEach(block=>{
    const lines=block.split("\n").map(l=>l.trim()).filter(Boolean);if(!lines.length)return;
    let q="",a="",cur=null;
    lines.forEach(l=>{
      const mq=l.match(/^(ސ|ސުވާލު|Q|q)\s*[:：.\-]\s*(.*)$/),ma=l.match(/^(ޖ|ޖަވާބު|A|a)\s*[:：.\-]\s*(.*)$/);
      if(mq){cur="q";q+=(q?"\n":"")+mq[2]}else if(ma){cur="a";a+=(a?"\n":"")+ma[2]}
      else if(cur==="q")q+="\n"+l;else if(cur==="a")a+="\n"+l;
      else if(!q){q=l;cur="a"}else{a+=(a?"\n":"")+l}
    });
    if(q.trim()&&a.trim())out.push({id:uid(),q:q.trim(),a:a.trim(),subj,known:0,seen:0,created:Date.now()+out.length});
  });
  return out;
}

async function pageLines(page){
  const tc=await page.getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str)return;const y=it.transform[5],x=it.transform[4];
    let row=rows.find(r=>Math.abs(r.y-y)<3);if(!row){row={y,items:[]};rows.push(row)}row.items.push({x,s:it.str})});
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{const rtl=/[\u0780-\u07BF]/.test(r.items.map(i=>i.s).join(""));
    r.items.sort((a,b)=>rtl?b.x-a.x:a.x-b.x);return r.items.map(i=>i.s).join(" ").replace(/\s+/g," ").trim()}).filter(Boolean);
}
function parseLoose(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const QR=/^(?:(?:Q|ސ)\s*\d*\s*[:：.)]|(?:ސުވާލު|Question|QUESTION|question)\s*\d*\s*[:：.\-)])\s*(.*)$/;
  const AR=/^(?:(?:A|ޖ)\s*[:：]|(?:ޖަވާބު|Ans|ANS|Answer|ANSWER|answer)\s*[:：.\-)])\s*(.*)$/;
  const NR=/^\(?\d{1,3}\s*[.)\-]\s+(.*)$/;
  if(!lines.some(l=>AR.test(l)))return [];
  const out=[];let q="",a="",cur=null;
  const push=()=>{if(q.trim()&&a.trim())out.push({q:q.trim(),a:a.trim(),on:true});q="";a="";cur=null};
  lines.forEach(l=>{let m;
    if((m=l.match(AR))){cur="a";a+=(a?"\n":"")+m[1];return}
    if((m=l.match(QR))||((cur===null||cur==="a")&&(m=l.match(NR)))){push();cur="q";q=m[1];return}
    if(cur==="q")q+=" "+l;else if(cur==="a")a+="\n"+l;
  });
  push();return out;
}
function addRows(rows){const seen=new Set(pdfRows.map(r=>r.q+"|"+r.a));rows.forEach(r=>{const k=r.q+"|"+r.a;if(!seen.has(k)){seen.add(k);pdfRows.push(r)}})}
function rowsFromSheet(aoa){
  const out=[];aoa.forEach((row,i)=>{const q=String(row[0]??"").trim(),a=String(row[1]??"").trim();
    if(!q||!a)return;if(i===0&&/^(q|question|questions|ސުވާލު)$/i.test(q))return;out.push({q,a,on:true})});return out;
}

  if(type==="application/pdf"||ext==="pdf"){
    const lib=await loadPdfJs();const doc=await lib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;
    const pages=[];for(let i=1;i<=doc.numPages;i++)pages.push((await pageLines(await doc.getPage(i))).join("\n"));
    const txt=pages.join("\n\n");srcPdfs.push(doc);
    if(txt.replace(/\s/g,"").length<20)return{note:"pdfNoText"};
    srcText+="\n\n"+txt;addRows(parseLoose(txt));return{};
  }
  if(type.startsWith("image/")){srcImages.push(await shrink(f));return{note:"imgAdded"}}
  if(ext==="docx"){
    await loadScript(CDN+"mammoth/1.6.0/mammoth.browser.min.js");
    const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
    srcText+="\n\n"+r.value;addText(r.value);return{};
  }
  if(["xlsx","xls","csv"].includes(ext)){
    await loadScript(CDN+"xlsx/0.18.5/xlsx.full.min.js");
    const wb=window.XLSX.read(await f.arrayBuffer(),{type:"array"});
    wb.SheetNames.forEach(n=>{const aoa=window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false});
      addRows(rowsFromSheet(aoa));srcText+="\n\n"+aoa.map(r=>r.join(" | ")).join("\n")});
    return{};
  }
  if(ext==="json"){const j=JSON.parse(await f.text());addRows((j.cards||j||[]).filter(c=>c&&c.q&&c.a).map(c=>({q:String(c.q),a:String(c.a),on:true})));return{}}
  if(type.startsWith("text/")||["txt","md"].includes(ext)){const txt=await f.text();srcText+="\n\n"+txt;addText(txt);return{}}
  return{note:"unsupported"};
}
function addText(txt){
  let rows=parseLoose(txt);
  if(!rows.length&&/(^|\n)\s*(ސ|Q)\s*[:：]/.test(txt))rows=parseBulk(txt,"").map(x=>({q:x.q,a:x.a,on:true}));
  addRows(rows);
}
async function handleFiles(files,pastedText){
  files=[...(files||[])].filter(Boolean);if(!files.length&&!pastedText)return;
  let lastNote=null,err=false;
  for(const f of files){
    fileCount++;
    try{const r=await readOne(f);if(r.note){lastNote=r.note==="unsupported"?t("unsupported",{f:f.name}):t(r.note);err=r.note!=="imgAdded"}}
    catch(e){console.error(e);lastNote=t("readFail",{f:f.name||"file"});err=true}
  }
  if(pastedText){fileCount++;srcText+="\n\n"+pastedText;addText(pastedText)}
  renderPreview();
  pStatus(pdfRows.length?t("fileFound",{n:pdfRows.length,f:fileCount}):(lastNote||t("fileNone")),!pdfRows.length&&err);
  const ai=await aiInfo();
  if(ai){$("#aiRow").hidden=false;$("#aiText").hidden=!srcText.trim();$("#aiImg").hidden=!(ai.images&&(srcImages.length||srcPdfs.length))}
}
$("#pdfFile").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value=""});
const dz=$("#dropZone");
["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag")}));
["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,()=>dz.classList.remove("drag")));
dz.addEventListener("drop",e=>{e.preventDefault();handleFiles(e.dataTransfer.files)});
/* Ctrl+V anywhere while the File tab is open (files, screenshots or copied text) */
document.addEventListener("paste",e=>{
  if(!$("#addDlg").open)return;
  const cd=e.clipboardData;if(!cd)return;
  const files=[...cd.files];
  if(addMode!=="pdf"){if(!files.length)return;setAddMode("pdf")}
  if(e.target.closest&&e.target.closest(".prow"))return;
  e.preventDefault();
  handleFiles(files,files.length?"":cd.getData("text/plain"));
});
$("#pasteBtn").onclick=async()=>{
  try{
    const items=await navigator.clipboard.read();const files=[];let txt="";
    for(const it of items){
      const img=it.types.find(x=>x.startsWith("image/"));
      if(img){const b=await it.getType(img);files.push(new File([b],"pasted."+img.split("/")[1],{type:img}));continue}
      if(it.types.includes("text/plain"))txt+=await (await it.getType("text/plain")).text();
    }
    if(!files.length&&!txt)throw 0;handleFiles(files,txt);
  }catch(e){
    try{const txt=await navigator.clipboard.readText();if(txt){handleFiles([],txt);return}}catch(e2){}
    toast(t("pasteFail"));
  }
};

const AI_RULES='You turn study material into flashcards. The material may be in Dhivehi (Thaana script), English, or both. '+
 'If it already contains questions with answers, return every pair with its original wording and language. '+
 'If it is notes without questions, write clear study questions whose answers come only from the material, in the same language as the material. '+
 'Never add facts that are not in the material. Return ONLY a JSON array like [{"q":"question","a":"answer"}], or [] if nothing is usable.';
function normAI(v){const arr=Array.isArray(v)?v:(v&&Array.isArray(v.items)?v.items:(v&&Array.isArray(v.cards)?v.cards:[]));
  return arr.filter(x=>x&&x.q&&x.a).map(x=>({q:String(x.q).trim(),a:String(x.a).trim(),on:true}))}
async function pdfPageImages(limit){
  const out=[];
  for(const doc of srcPdfs){for(let i=1;i<=doc.numPages&&out.length<limit;i++){
    const page=await doc.getPage(i);const vp=page.getViewport({scale:1.6});
    const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
    await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    out.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)));
  }}
  return out;
}
async function runAI(useImages){
  if(!(await aiInfo()))return;
  [$("#aiText"),$("#aiImg"),$("#saveBtn")].forEach(b=>b.disabled=true);
  const found=[];
  try{
    if(useImages){
      const imgs=srcImages.slice(0,15).concat(await pdfPageImages(Math.max(0,15-srcImages.length)));
      for(let i=0;i<imgs.length;i++){
        pStatus(t("aiWorking",{i:i+1,n:imgs.length}));
        found.push(...normAI(await aiJSON(AI_RULES+"\n\nThe material is the attached image. Read the text carefully.",imgs[i])));
      }
    }else{
      const chunks=[];for(let i=0;i<srcText.length&&chunks.length<10;i+=9000)chunks.push(srcText.slice(i,i+9000));
      for(let i=0;i<chunks.length;i++){
        pStatus(t("aiWorking",{i:i+1,n:chunks.length}));
        found.push(...normAI(await aiJSON(AI_RULES+"\n\nMATERIAL (extracted from files, line order may be imperfect):\n"+chunks[i])));
      }
    }
    pdfRows=[];addRows(found);renderPreview();
    pStatus(pdfRows.length?t("aiDone",{n:pdfRows.length}):t("aiNothing"),!pdfRows.length);
  }catch(err){
    console.error(err);if(found.length){pdfRows=[];addRows(found);renderPreview()}
    pStatus(err&&err.code==="not_granted"?t("aiDenied"):t("aiFail"),true);
  }finally{$("#aiText").disabled=false;$("#aiImg").disabled=false;updateSaveLabel()}
}
$("#aiText").onclick=()=>runAI(false);
$("#aiImg").onclick=()=>runAI(true);

/* ---------- flashcards ---------- */
let fDeck=[],fIdx=0,fOnlyNew=false;
function flashStart(){
  if(flashFilter!==ALL&&!subjects().includes(flashFilter))flashFilter=ALL;
  renderChips($("#chips-flash"),flashFilter,s=>{flashFilter=s;flashStart()});
  let pool=bySubj(flashFilter);if(fOnlyNew)pool=pool.filter(c=>!isKnown(c));
  fDeck=shuffle(pool);fIdx=0;flashRender();
}
function flashRender(){
  const st=$("#flashStage");
  if(!cards.length){st.innerHTML=needCards(1);return}
  const toggle=`<label class="toggle"><input type="checkbox" id="onlyNew" ${fOnlyNew?"checked":""}> ${t("onlyNew")}</label>`;
  if(!fDeck.length){st.innerHTML=`<div class="empty"><h2>${t("allLearned")}</h2><p>${t("allLearnedTip")}</p></div>${toggle}`;bindOnly();return}
  if(fIdx>=fDeck.length){
    st.innerHTML=`<div class="empty"><h2>${t("roundDone")}</h2><p>${t("cardsSeen",{n:fDeck.length})}</p><div class="row"><button class="btn primary" id="fAgain">${t("again")}</button></div></div>${toggle}`;
    $("#fAgain").onclick=flashStart;bindOnly();return;
  }
  const c=fDeck[fIdx];
  st.innerHTML=`<div class="progress"><span class="num">${fIdx+1} / ${fDeck.length}</span><span dir="auto">${esc(c.subj||"")}</span></div>
   <button class="flash" id="fCard" aria-label="${t("flipCard")}"><div class="inner">
     <div class="face front"><span dir="auto">${esc(c.q)}</span><small>${t("tapAns")}</small></div>
     <div class="face back"><span dir="auto">${esc(c.a)}</span><small>${t("tapBack")}</small></div></div></button>
   <div class="row"><button class="btn bad big" id="fNo">${t("dontKnow")}</button><button class="btn ok big" id="fYes">${t("know")}</button></div>${toggle}`;
  const card=$("#fCard");card.onclick=()=>card.classList.toggle("flipped");
  $("#fYes").onclick=()=>{bump(c,true);fIdx++;flashRender()};
  $("#fNo").onclick=()=>{bump(c,false);fDeck.push(c);fIdx++;flashRender()};
  bindOnly();
}
function bindOnly(){const o=$("#onlyNew");if(o)o.onchange=()=>{fOnlyNew=o.checked;flashStart()}}

/* ---------- quiz ---------- */
let qz=null;
function quizSetup(){
  const st=$("#quizStage");
  if(cards.length<2){st.innerHTML=needCards(2);return}
  st.innerHTML=`<div class="setup"><h2>${t("quizTitle")}</h2><p>${t("quizText")}</p>${subjectSelect("qzSubj")}
   <label class="f">${t("qCount")}<select id="qzN"><option>5</option><option selected>10</option><option>20</option><option value="999">${t("all")}</option></select></label>
   <button class="btn primary big" id="qzGo">${t("startQuiz")}</button></div>`;
  $("#qzGo").onclick=()=>{
    const pool=bySubj($("#qzSubj").value);if(pool.length<2){toast(t("fewSubj"));return}
    qz={pool,qs:shuffle(pool).slice(0,+$("#qzN").value),i:0,score:0,wrong:[]};quizQ();
  };
}
function quizQ(){
  const st=$("#quizStage");
  if(qz.i>=qz.qs.length){
    const pct=Math.round(qz.score/qz.qs.length*100);
    st.innerHTML=`<div class="setup center"><p>${t("result")}</p><div class="score">${qz.score} / ${qz.qs.length}</div>
     <p>${pct>=80?t("great"):pct>=50?t("good"):t("tryAgain")}</p>
     <div class="row" style="justify-content:center"><button class="btn primary" id="qzAgain">${t("playAgain")}</button></div>
     ${qz.wrong.length?`<ul class="review">${qz.wrong.map(c=>`<li><b dir="auto">${esc(c.q)}</b>${hl(c.a)}</li>`).join("")}</ul>`:""}</div>`;
    $("#qzAgain").onclick=quizSetup;return;
  }
  const c=qz.qs[qz.i];
  const others=shuffle([...new Set(qz.pool.concat(cards).filter(x=>x.id!==c.id&&x.a!==c.a).map(x=>x.a))]).slice(0,3);
  const opts=shuffle([c.a,...others]);
  st.innerHTML=`<div class="progress"><span>${t("qOf",{i:qz.i+1,n:qz.qs.length})}</span><span>${t("points",{n:qz.score})}</span></div>
   <div class="qcard"><h3 dir="auto">${esc(c.q)}</h3><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" dir="auto">${esc(o)}</button>`).join("")}</div>
   <div class="fb" id="qzFb" aria-live="polite"></div><button class="btn primary" id="qzNext" hidden></button></div>`;
  const btns=$$(".opt");
  btns.forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.i]===c.a;
    btns.forEach(x=>{x.disabled=true;if(opts[+x.dataset.i]===c.a)x.classList.add("right")});
    if(!ok){b.classList.add("wrong");qz.wrong.push(c)}else qz.score++;
    const fb=$("#qzFb");fb.className="fb "+(ok?"ok":"bad");fb.textContent=ok?t("correct"):t("wrongAns");
    bump(c,ok);
    const nx=$("#qzNext");nx.hidden=false;nx.textContent=qz.i+1<qz.qs.length?t("next"):t("seeResult");nx.focus();
    nx.onclick=()=>{qz.i++;quizQ()};
  });
}

/* ---------- match ---------- */
let mg=null,mgTick=null;
function matchSetup(){
  clearInterval(mgTick);
  const st=$("#matchStage");
  if(cards.length<3){st.innerHTML=needCards(3);return}
  st.innerHTML=`<div class="setup"><h2>${t("matchTitle")}</h2><p>${t("matchText")}</p>${subjectSelect("mgSubj")}<button class="btn primary big" id="mgGo">${t("start")}</button></div>`;
  $("#mgGo").onclick=()=>{
    const pool=bySubj($("#mgSubj").value);if(pool.length<3){toast(t("fewSubj"));return}
    mg={set:shuffle(pool).slice(0,5),sel:null,done:0,start:Date.now(),miss:0};matchRender();
  };
}
function matchRender(){
  const st=$("#matchStage");const qs=shuffle(mg.set),as=shuffle(mg.set);
  st.innerHTML=`<div class="progress"><span>⏱ <span class="secs" id="mgT">0</span> ${t("seconds")}</span><span id="mgMiss">${t("misses",{n:mg.miss})}</span></div>
   <div class="mgrid"><div class="mcol">${qs.map(c=>`<button class="tile q" data-id="${c.id}" data-k="q" dir="auto">${esc(c.q)}</button>`).join("")}</div>
   <div class="mcol">${as.map(c=>`<button class="tile" data-id="${c.id}" data-k="a" dir="auto">${esc(c.a)}</button>`).join("")}</div></div>`;
  mgTick=setInterval(()=>{const el=$("#mgT");if(el)el.textContent=Math.floor((Date.now()-mg.start)/1000)},1000);
  st.querySelectorAll(".tile").forEach(tile=>tile.onclick=()=>{
    if(!mg.sel||mg.sel.dataset.k===tile.dataset.k){st.querySelectorAll(".tile.sel").forEach(x=>x.classList.remove("sel"));tile.classList.add("sel");mg.sel=tile;return}
    const a=mg.sel;mg.sel=null;a.classList.remove("sel");
    if(a.dataset.id===tile.dataset.id){a.classList.add("done");tile.classList.add("done");mg.done++;
      if(mg.done===mg.set.length){clearInterval(mgTick);const s=Math.floor((Date.now()-mg.start)/1000);
        setTimeout(()=>{st.innerHTML=`<div class="setup center"><p>${t("done")}</p><div class="score">${s} <span style="font-size:1.2rem">${t("seconds")}</span></div><p>${t("misses",{n:mg.miss})}</p><button class="btn primary" id="mgAgain">${t("playAgain")}</button></div>`;$("#mgAgain").onclick=matchSetup},400)}
    }else{mg.miss++;[a,tile].forEach(x=>{x.classList.remove("shake");void x.offsetWidth;x.classList.add("shake")});$("#mgMiss").textContent=t("misses",{n:mg.miss})}
  });
}

/* ---------- group ---------- */
let gp=null,gpTimer=null;
function stopTimers(){clearInterval(gpTimer);gpTimer=null;clearInterval(mgTick)}
function groupSetup(){
  const st=$("#groupStage");
  if(cards.length<1){st.innerHTML=needCards(1);return}
  st.innerHTML=`<div class="setup"><h2>${t("groupTitle")}</h2><p>${t("groupText")}</p>
    <label class="f">${t("teamCount")}<select id="gpN"><option>2</option><option>3</option><option>4</option></select></label>
    <div class="teams" id="gpNames"></div>${subjectSelect("gpSubj")}
    <label class="f">${t("timePerQ")}<select id="gpSec"><option value="15">${t("s15")}</option><option value="30" selected>${t("s30")}</option><option value="60">${t("s60")}</option></select></label>
    <label class="f">${t("qPerTeam")}<select id="gpR"><option>3</option><option selected>5</option><option>10</option></select></label>
    <button class="btn primary big" id="gpGo">${t("startGame")}</button></div>`;
  const names=()=>{const n=+$("#gpN").value;$("#gpNames").innerHTML=Array.from({length:n},(_,i)=>`<label class="f">${t("teamName",{n:i+1})}<input data-team dir="auto" value="${esc(t("teamDefaults")[i])}"></label>`).join("")};
  names();$("#gpN").onchange=names;
  $("#gpGo").onclick=()=>{
    const teams=$$("[data-team]").map((inp,k)=>({name:inp.value.trim()||t("team",{n:k+1}),score:0}));
    const pool=bySubj($("#gpSubj").value);
    const total=Math.min(pool.length,teams.length*(+$("#gpR").value));
    if(total<1){toast(t("noQSubj"));return}
    gp={teams,qs:shuffle(pool).slice(0,total),i:0,sec:+$("#gpSec").value};groupQ();
  };
}
const board=turn=>`<div class="board">${gp.teams.map((tm,i)=>`<div class="team${i===turn?" turn":""}"><div class="n" dir="auto">${esc(tm.name)}</div><div class="s">${tm.score}</div></div>`).join("")}</div>`;
function groupQ(){
  stopTimers();
  const st=$("#groupStage");
  if(gp.i>=gp.qs.length){
    const top=Math.max(...gp.teams.map(x=>x.score)),win=gp.teams.filter(x=>x.score===top);
    st.innerHTML=`${board(-1)}<div class="setup center"><p>${t("gameOver")}</p><div class="score">🏆</div>
      <h2>${win.length>1?t("tie")+win.map(x=>esc(x.name)).join(t("sep")):t("wins",{t:esc(win[0].name)})}</h2>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="gpAgain">${t("again")}</button></div></div>`;
    $("#gpAgain").onclick=groupSetup;return;
  }
  const turn=gp.i%gp.teams.length,c=gp.qs[gp.i];let left=gp.sec;
  st.innerHTML=`${board(turn)}<div class="turnline">${t("turnOf",{t:esc(gp.teams[turn].name)})}</div>
    <div class="timer" id="gpBar"><i style="width:100%"></i></div><div class="secs" id="gpSecs">${left}</div>
    <div class="qcard"><p class="sub">${t("qOf",{i:gp.i+1,n:gp.qs.length})}</p><h3 dir="auto">${esc(c.q)}</h3>
      <div id="gpAns" hidden><p>${hl(c.a)}</p></div>
      <div class="row" id="gpAct"><button class="btn primary" id="gpShow">${t("showAns")}</button></div></div>`;
  const reveal=()=>{
    stopTimers();$("#gpAns").hidden=false;
    const others=gp.teams.map((_,i)=>i).filter(i=>i!==turn);
    $("#gpAct").innerHTML=`<button class="btn ok" data-pt="${turn}">${t("rightPt")}</button><button class="btn bad" data-pt="-1">${t("wrong")}</button>`+
      others.map(i=>`<button class="btn" data-pt="${i}">${t("stole",{t:esc(gp.teams[i].name)})}</button>`).join("");
    $$("#gpAct [data-pt]").forEach(b=>b.onclick=()=>{const k=+b.dataset.pt;if(k>=0)gp.teams[k].score++;gp.i++;groupQ()});
  };
  $("#gpShow").onclick=reveal;
  gpTimer=setInterval(()=>{
    left--;const bar=$("#gpBar");if(!bar){stopTimers();return}
    bar.querySelector("i").style.width=Math.max(0,left/gp.sec*100)+"%";bar.classList.toggle("low",left<=5);
    $("#gpSecs").textContent=Math.max(0,left);
    if(left<=0){toast(t("timeUp"));reveal()}
  },1000);
}
